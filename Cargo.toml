[package]
name = "pkarena0-web"
description = "single player playing agains a table of bots using pkcore."
repository = "https://github.com/ImperialBower/pkarena0-web"
version = "0.1.20"
edition = "2024"
rust-version = "1.94.1"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
pkcore = { version = "0.4.0", default-features = false, features = [
    "bot-profiles",
    "hand-histories",
    "equity",
    "player-stats",
] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
rand = "0.9"
# Pure-Rust YAML (same lib pkcore's bot-profiles uses); parses the embedded
# bot-lineup bundles (EPIC-49). wasm-safe.
serde_yaml_bw = "2.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
# Matches pkcore's transitive uuid (same type as `Player.id`); tests name
# `uuid::Uuid` to author `StatsRegistry` identities.
uuid = "1"
